env:
  num_rl_envs: 1
  num_planning_envs: 16
  env_spacing: 2.0
  # Execution-loop horizon for run_mcts.py: fail the episode after this many steps.
  max_execution_steps: 200
  # Fail early if the distance to goal improves by less than this (m) over the window.
  no_progress_steps: 50
  no_progress_threshold: 0.05

planning:
  # Number of physics ticks per generative-model macro-action (60 Hz).
  # 30 = 0.5 s; benchmark 30/20/15/10 to trade displacement vs runtime.
  macro_action_ticks: 30

room:
  # Preset
  type: "custom"
  
  # Custom
  width: 5.0
  depth: 5.0

  # Minimum Euclidean separation (m) between sampled start and goal poses.
  min_start_goal_dist: 2.0

  # Occupancy-map parameters (single source of truth for collision-free sampling).
  occupancy_resolution: 0.05
  safety_margin: 0.05

  obstacles:
    - type: "box"
      x: 0.0
      z: 0.0
      width: 1.0
      depth: 1.0
    - type: "box"
      x: 1.5
      z: 1.5
      width: 2.0
      depth: 0.5

sensors:
  enable_bumper: True
  enable_lidar: false
  enable_camera: false
  lidar_rays: 64
  camera_res: 64

robot:
  urdf_path: "roomba.urdf"
  radius: 0.17
  max_linear_velocity: 0.6   # m/s
  max_angular_velocity: 2.00  # rad/s
