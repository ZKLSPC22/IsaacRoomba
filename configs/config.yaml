env:
  num_rl_envs: 9
  num_planning_envs: 9
  env_spacing: 2.0  # Buffer/clearance distance (metres) between adjacent room outer walls

planning:
  # Number of physics ticks per generative-model macro-action.
  # At 30 Hz (dt=1/30), 15 ticks = 0.5 seconds duration.
  macro_action_ticks: 15

rl:
  max_episode_steps: 3600     # 120s at 30 Hz (replaces hard-coded 3600 in _compute_dones)
  progress_weight: 5.0        # Multiplier for high-water-mark distance improvement

task:
  # Task objective constants (single source of truth for the planning reward and
  # the leaf-value heuristic). Distances are metres; rewards are in reward units.
  goal_radius: 0.5      # distance at which the goal counts as reached
  goal_reward: 10.0     # reward for reaching the goal
  collision_penalty: -5.0  # reward contribution for a bumper contact
  step_cost: -0.1       # reward contribution per macro-action
  # Bumper sensitivity in newtons, tested against the HORIZONTAL contact force only
  # (world X/Z). The vertical component carries the ground reaction and is large at
  # rest, so including it fired the bumper on every step in free space. Measured
  # free-space horizontal peak 2e-6 N vs 12.5-19.0 N for a real wall contact.
  bumped_threshold: 2.0
  wheels_reset: True

  # Interpolation used when the leaf heuristic samples the geodesic distance
  # field. "bilinear" blends the four neighbouring cells (the documented contract,
  # and a smooth gradient); "nearest" quantizes to the containing cell centre, up
  # to half a cell (0.025 m) coarser, with a staircase gradient, but it reproduces
  # the sampling used before this became configurable.
  heuristic_sampling: "bilinear"

room:
  # Preset selector: "empty", "standard", or "custom".
  type: "custom"

  # Custom layout (ignored when a preset type is selected).
  custom:
    width: 5.0
    depth: 5.0

    obstacles:
      - type: "box"
        x: 0.0
        z: 0.0
        width: 1.0
        depth: 1.0

      - type: "box"
        x: 1.5
        z: 1.5
        width: 2.0
        depth: 0.5

  # Occupancy-map parameters (single source of truth for collision-free sampling).
  occupancy_map:
    resolution: 0.05
    safety_margin: 0.05

  # Minimum Euclidean separation (m) between sampled start and goal poses.
  start_goal_sampling:
    min_distance: 2.0

sensors:
  enable_bumper: True
  enable_lidar: false
  enable_camera: false
  lidar_rays: 64
  camera_res: 64

robot:
  urdf_path: "roomba.urdf"
  radius: 0.17
  max_linear_velocity: 0.6   # m/s
  max_angular_velocity: 2.00  # rad/s
